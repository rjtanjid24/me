<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যাডমিন ড্যাশবোর্ড - মেসেজ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Hind Siliguri', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--glass-border);
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 600;
        }

        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .status-badge {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-badge .dot {
            width: 8px;
            height: 8px;
            background-color: var(--success);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        button {
            padding: 10px 20px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover { background: var(--accent-hover); }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-card h3 {
            color: var(--text-secondary);
            font-size: 1rem;
            margin-bottom: 10px;
        }

        .stat-card .number {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .message-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 20px;
            border-radius: 12px;
            transition: transform 0.2s;
        }

        .message-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            border-bottom: 1px dashed rgba(255,255,255,0.1);
            padding-bottom: 8px;
        }

        .sender-name {
            color: var(--text-primary);
            font-weight: 600;
            font-size: 1.1rem;
        }

        .message-body {
            line-height: 1.6;
            color: #e2e8f0;
            white-space: pre-wrap;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>অ্যাডমিন ড্যাশবোর্ড</h1>
            <div class="controls">
                <div class="status-badge">
                    <span class="dot"></span> লাইভ আপডেট চালু
                </div>
                <button id="enableNotifBtn" onclick="enableNotifications()">নোটিফিকেশন ও সাউন্ড চালু করুন</button>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>সর্বমোট বার্তা</h3>
                <div class="number" id="totalCount">০</div>
            </div>
        </div>

        <div class="message-list" id="messageContainer">
            <div class="loading">বার্তা লোড হচ্ছে...</div>
        </div>
    </div>

    <script>
        // এখানে আপনার Google Apps Script এর URL বসান
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwZynAjWJGT0SQXS2WpiftLDmqwwJFuXTiAwXAUYexKzdBkeyVWf8l076MJP-HP2Lnt/exec'; 
        
        let previousCount = 0;
        let isFirstLoad = true;
        let notificationsEnabled = false;

        // সাউন্ড তৈরি করার ফাংশন (বাইরের কোনো অডিও ফাইলের দরকার নেই)
        function playAlertSound() {
            if (!notificationsEnabled) return;
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gainNode = ctx.createGain();
            
            osc.connect(gainNode);
            gainNode.connect(ctx.destination);
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, ctx.currentTime); // A5 Note
            gainNode.gain.setValueAtTime(0.1, ctx.currentTime);
            
            osc.start();
            osc.stop(ctx.currentTime + 0.15); // খুব ছোট কিউট একটা বিপ সাউন্ড
        }

        // নোটিফিকেশন পারমিশন নেওয়া
        function enableNotifications() {
            Notification.requestPermission().then(permission => {
                if (permission === 'granted') {
                    notificationsEnabled = true;
                    document.getElementById('enableNotifBtn').style.display = 'none';
                    alert("নোটিফিকেশন এবং সাউন্ড সফলভাবে চালু হয়েছে!");
                }
            });
        }

        // ডেক্সটপ নোটিফিকেশন দেখানোর ফাংশন
        function showDesktopNotification(sender, text) {
            if (notificationsEnabled && Notification.permission === "granted") {
                new Notification("নতুন বার্তা এসেছে!", {
                    body: `${sender}: ${text.substring(0, 40)}...`,
                    icon: "https://cdn-icons-png.flaticon.com/512/733/733585.png" // একটি ডামি মেসেজ আইকন
                });
            }
        }

        // তারিখ ফরমেট করার ফাংশন
        function formatDate(dateString) {
            const options = { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit' };
            return new Date(dateString).toLocaleDateString('bn-BD', options);
        }

        // ডাটা ফেচ করার মূল ফাংশন
        async function fetchMessages() {
            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                
                // নতুন থেকে পুরানো মেসেজ সাজানো (Reverse)
                const reversedData = data.reverse();
                const currentCount = reversedData.length;

                // নতুন মেসেজ চেক করা
                if (!isFirstLoad && currentCount > previousCount) {
                    const newMessagesCount = currentCount - previousCount;
                    const latestMsg = reversedData[0];
                    
                    playAlertSound();
                    showDesktopNotification(latestMsg.name, latestMsg.message);
                    document.title = `(${newMessagesCount}) নতুন বার্তা - ড্যাশবোর্ড`;
                }

                // ড্যাশবোর্ড আপডেট করা
                document.getElementById('totalCount').innerText = currentCount;
                renderMessages(reversedData);

                previousCount = currentCount;
                isFirstLoad = false;

            } catch (error) {
                console.error("ডাটা লোড করতে সমস্যা হচ্ছে:", error);
            }
        }

        // এইচটিএমএলে মেসেজগুলো রেন্ডার করা
        function renderMessages(messages) {
            const container = document.getElementById('messageContainer');
            container.innerHTML = ''; // ক্লিয়ার করা

            if(messages.length === 0) {
                container.innerHTML = '<div class="loading">এখনো কোনো বার্তা আসেনি।</div>';
                return;
            }

            messages.forEach(msg => {
                const card = document.createElement('div');
                card.className = 'message-card';
                card.innerHTML = `
                    <div class="message-header">
                        <span class="sender-name">${msg.name || 'ছদ্মনাম'}</span>
                        <span class="time">${formatDate(msg.timestamp)}</span>
                    </div>
                    <div class="message-body">${msg.message}</div>
                    <div style="font-size: 0.8rem; color: #64748b; margin-top: 10px;">ইমেইল: ${msg.email || 'দেওয়া হয়নি'}</div>
                `;
                container.appendChild(card);
            });
        }

        // পেজ লোড হওয়ার পর প্রথমবার ডাটা আনা
        fetchMessages();

        // প্রতি ৩০ সেকেন্ড পর পর নতুন ডাটা চেক করা
        setInterval(fetchMessages, 30000); 

        // ব্রাউজার ট্যাবে গেলে টাইটেল ঠিক করে দেওয়া
        window.onfocus = function() {
            document.title = "অ্যাডমিন ড্যাশবোর্ড - মেসেজ";
        };
    </script>
</body>
</html>
