<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send an Anonymous Message</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Hind Siliguri', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top right, #1e293b, transparent 40%),
                              radial-gradient(circle at bottom left, #0f172a, transparent 40%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .form-container {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-header h2 {
            font-weight: 600;
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        .form-header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .input-group input,
        .input-group textarea {
            width: 100%;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .input-group input:focus,
        .input-group textarea:focus {
            border-color: var(--accent-color);
        }

        .input-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        button:hover {
            background: var(--accent-hover);
        }

        button:disabled {
            background: #475569;
            cursor: not-allowed;
        }

        #statusMessage {
            margin-top: 15px;
            text-align: center;
            font-size: 0.9rem;
            display: none;
        }

        .success { color: #10b981; }
        .error { color: #ef4444; }
        
        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid #fff;
            border-bottom-color: transparent;
            border-radius: 50%;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="form-container">
        <div class="form-header">
            <h2>Send Your Messages</h2>
            <p>আপনার পরিচয় গোপন রেখেই বার্তা বা মতামত জানাতে পারেন।</p>
        </div>

        <form id="messageForm">
            <div class="input-group">
                <label for="name">আপনার নাম</label>
                <input type="text" id="name" name="name" required placeholder="নাম বা ছদ্মনাম লিখুন">
            </div>

            <div class="input-group">
                <label for="email">ইমেইল এড্রেস (ঐচ্ছিক)</label>
                <input type="email" id="email" name="email" placeholder="example@example.com">
            </div>

            <div class="input-group">
                <label for="message">বার্তা</label>
                <textarea id="message" name="message" required placeholder="এখানে আপনার বার্তা লিখুন..."></textarea>
            </div>

            <button type="submit" id="submitBtn">
                <span class="btn-text">পাঠিয়ে দিন</span>
                <span class="spinner" id="spinner"></span>
            </button>
            
            <div id="statusMessage"></div>
        </form>
    </div>

    <script>
        // এখানে আপনার Google Apps Script এর URL বসান
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwZynAjWJGT0SQXS2WpiftLDmqwwJFuXTiAwXAUYexKzdBkeyVWf8l076MJP-HP2Lnt/exec'; 

        const form = document.getElementById('messageForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.querySelector('.btn-text');
        const spinner = document.getElementById('spinner');
        const statusMessage = document.getElementById('statusMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            submitBtn.disabled = true;
            btnText.textContent = 'পাঠানো হচ্ছে...';
            spinner.style.display = 'block';
            statusMessage.style.display = 'none';

            const formData = new FormData(form);

            try {
                // mode: 'no-cors' যোগ করা হয়েছে যাতে গুগল ব্লক না করে
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: formData
                });

                // no-cors ব্যবহার করলে রেসপন্স রিড করা যায় না, তাই সরাসরি সাকসেস মেসেজ দেখিয়ে দিচ্ছি
                statusMessage.textContent = 'বার্তা সফলভাবে পাঠানো হয়েছে!';
                statusMessage.className = 'success';
                statusMessage.style.display = 'block';
                form.reset();
                
            } catch (error) {
                statusMessage.textContent = 'দুঃখিত, কানেকশনে সমস্যা হয়েছে। আবার চেষ্টা করুন।';
                statusMessage.className = 'error';
                statusMessage.style.display = 'block';
                console.error('Error!', error);
            } finally {
                submitBtn.disabled = false;
                btnText.textContent = 'পাঠিয়ে দিন';
                spinner.style.display = 'none';
                
                // ৫ সেকেন্ড পর মেসেজটি লুকিয়ে ফেলার জন্য
                setTimeout(() => {
                    statusMessage.style.display = 'none';
                }, 5000);
            }
        });
    </script>
</body>
</html>
